name: IPTV Merge

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create Folder
        run: mkdir -p playlists

      - name: Download Playlists
        run: |
          curl -L "https://raw.githubusercontent.com/srhady/fifaplus/refs/heads/main/fifa_live.m3u" -o playlists/fifa.m3u

          curl -L "https://raw.githubusercontent.com/srhady/bingstream/refs/heads/main/playlist.m3u" -o playlists/bing.m3u

          curl -L "https://raw.githubusercontent.com/srhady/tapmad-bd/refs/heads/main/tapmad_bd.m3u" -o playlists/tapmad.m3u

          curl -L "https://raw.githubusercontent.com/srhady/SonyLiv/refs/heads/main/sonyliv_playlist.m3u" -o playlists/sonyliv.m3u

          curl -L "https://raw.githubusercontent.com/srhady/Fancode-bd/refs/heads/main/main_playlist.m3u" -o playlists/fancode.m3u

      - name: Create Combined Playlist
        run: |
          echo "#EXTM3U" > combined.m3u

          # FIRST PLAYLIST
          curl -L "https://raw.githubusercontent.com/MRM3UK/New-try/refs/heads/main/MOVIES%20-%20FTP.m3u" | tail -n +2 >> combined.m3u

          echo "" >> combined.m3u

          # AUTO PLAYLISTS
          tail -n +2 playlists/fifa.m3u >> combined.m3u
          echo "" >> combined.m3u

          tail -n +2 playlists/bing.m3u >> combined.m3u
          echo "" >> combined.m3u

          tail -n +2 playlists/tapmad.m3u >> combined.m3u
          echo "" >> combined.m3u

          tail -n +2 playlists/sonyliv.m3u >> combined.m3u
          echo "" >> combined.m3u

          tail -n +2 playlists/fancode.m3u >> combined.m3u

      - name: Remove Duplicates
        run: |
          awk '!seen[$0]++' combined.m3u > temp.m3u
          mv temp.m3u combined.m3u

      - name: Push Playlist
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add .
          git commit -m "Updated playlist" || echo "No changes"
          git push
